 const name=String(value||"").trim();
 if(name.length<2)return;
 try{
  const raw=JSON.parse(localStorage.getItem(CLIENT_SUGGESTIONS_KEY)||"[]");
  const items=Array.isArray(raw)?raw:[];
  const now=Date.now(),key=name.toLowerCase();
  const idx=items.findIndex(v=>
   (typeof v==="string"&&v.trim().toLowerCase()===key) ||
   (v&&typeof v==="object"&&String(v.name||"").trim().toLowerCase()===key)
  );
  if(idx>=0){
   const old=items[idx];
   items[idx]={
    name,
    count:Math.max(0,typeof old==="object"?n(old.count):1)+1,
    last:now
   };
  }else{
   items.push({name,count:1,last:now});
  }
  items.sort((a,b)=>n(b.count)-n(a.count)||n(b.last)-n(a.last));
  localStorage.setItem(CLIENT_SUGGESTIONS_KEY,JSON.stringify(items.slice(0,100)));
 }catch(e){}
}

function readAndCompressImage(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve(null);return}
  if(!file.type||!file.type.startsWith("image/")){reject(new Error("Selecciona un archivo de imagen."));return}
  const reader=new FileReader();reader.onerror=()=>reject(new Error("No se pudo leer la imagen."));
  reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("La imagen no es válida."));img.onload=()=>{
   const maxSide=1100,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
   const w=Math.max(1,Math.round(img.naturalWidth*scale)),hh=Math.max(1,Math.round(img.naturalHeight*scale));
   const canvas=document.createElement("canvas");canvas.width=w;canvas.height=hh;const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,hh);
   let quality=.76,data=canvas.toDataURL("image/jpeg",quality);while(data.length>180000&&quality>.35){quality-=.06;data=canvas.toDataURL("image/jpeg",quality)}
   if(data.length>260000){reject(new Error("La imagen sigue siendo demasiado grande. Usa una imagen más pequeña."));return}
   resolve({data,name:file.name});
  };img.src=reader.result};reader.readAsDataURL(file);
 });
}

function initFirebase(){
 try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();

  db.collection("designers").onSnapshot(async snap=>{
    try{
     if(snap.empty && !designersLoadedFromCloud){
      const batch=db.batch();
      Object.keys(DESIGNER_PINS).forEach(name=>batch.set(db.collection("designers").doc(name),{name,pin:DESIGNER_PINS[name],active:true}));
      await batch.commit(); designersLoadedFromCloud=true; return;
     }
     const active=snap.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.active!==false);
     DESIGNERS=active.map(d=>String(d.name||d.id).trim().toUpperCase()).filter(Boolean);
     DESIGNER_PINS={}; active.forEach(d=>{DESIGNER_PINS[String(d.name||d.id).trim().toUpperCase()]=String(d.pin||"")});
     designersLoadedFromCloud=true; render();
    }catch(e){console.warn("No se pudieron sincronizar diseñadores",e)}
   },err=>console.warn("No se pudieron cargar diseñadores",err));

   db.collection("orders").onSnapshot(snap=>{
   state.orders=snap.docs.map(d=>({...d.data(),id:d.id}));
   state.ordersReady=true;firestoreError=null;render();
  },err=>{firestoreError=err.message;state.ordersReady=true;render()});

  db.collection("designLogs").onSnapshot(snap=>{state.designLogs=snap.docs.map(d=>({...d.data(),id:d.id}));render();},err=>{console.warn("No se pudieron cargar los registros de diseño",err)});
  // Historial compacto: conserva solo cifras agregadas de diseños ya liquidados.
  db.collection("designStats").onSnapshot(snap=>{state.designStats=snap.docs.map(d=>({...d.data(),id:d.id}));render();},err=>{console.warn("No se pudieron cargar las estadísticas consolidadas de diseño",err)});
   db.collection("designPayments").onSnapshot(snap=>{state.designPayments=snap.docs.map(d=>({...d.data(),id:d.id}));render();},err=>{console.warn("No se pudo cargar historial de pagos",err)});
   purgeMonthlyDesignPayments();

   db.collection("counters").onSnapshot(snap=>{
   const c={};snap.forEach(d=>c[d.id]=(d.data()||{}).lastNumber||0);
   state.counters=c;state.countersReady=true;render();
  },err=>{firestoreError=err.message;state.countersReady=true;render()});
 }catch(e){
  firestoreError=e.message;state.ordersReady=true;state.countersReady=true;render();
 }
}

async function purgeOldOrders(days){
 if(!state.isAdmin||!db)return;
 const cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-days);
 const targets=(state.orders||[]).filter(o=>{
  const d=String(o.date||"");
  return d && new Date(d+"T00:00:00")<cutoff;
 });
 if(!targets.length){alert(`No hay órdenes anteriores a ${days} días para eliminar.`);setState({cleanupConfirmDays:null});return;}
 try{
  for(let i=0;i<targets.length;i+=400){
   const batch=db.batch();
   targets.slice(i,i+400).forEach(o=>batch.delete(db.collection("orders").doc(o.id)));
   await batch.commit();
  }
  state.cleanupConfirmDays=null;state.orderHistoryPage=1;render();
  alert(`Se eliminaron ${targets.length} órdenes anteriores a ${days} días.`);
 }catch(e){alert("No se pudieron eliminar todas las órdenes: "+e.message);}
}

async function exportOrderPdf(id){
 const o=state.orders.find(x=>x.id===id);if(!o)return;
 const pa=document.getElementById("print-area");
 pa.innerHTML=printableOrderHtml(o);
 const prev={
  display:pa.style.display,visibility:pa.style.visibility,position:pa.style.position,
  left:pa.style.left,top:pa.style.top,width:pa.style.width,height:pa.style.height,
  padding:pa.style.padding,boxSizing:pa.style.boxSizing
 };

 // La página NO se escala ni se transforma. Se imprime directamente en
 // media carta horizontal: 8.5 × 5.5 pulgadas.
 pa.style.display="block";
 pa.style.visibility="hidden";
 pa.style.position="static";
 pa.style.left="auto";
 pa.style.top="auto";
 pa.style.width="8.5in";
 pa.style.height="5.5in";
 pa.style.padding="0.25in";
 pa.style.boxSizing="border-box";

 // Esperar a que las imágenes estén listas para que no aparezcan espacios vacíos.
 const images=Array.from(pa.querySelectorAll("img"));
 await Promise.all(images.map(img=>new Promise(resolve=>{
  if(img.complete){
   if(img.decode)img.decode().catch(()=>{}).finally(resolve); else resolve();
  }else{
   img.addEventListener("load",resolve,{once:true});
   img.addEventListener("error",resolve,{once:true});
  }
 })));
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

 const cleanup=()=>{
  pa.style.display=prev.display;
  pa.style.visibility=prev.visibility;
  pa.style.position=prev.position;
  pa.style.left=prev.left;
  pa.style.top=prev.top;
  pa.style.width=prev.width;
  pa.style.height=prev.height;
  pa.style.padding=prev.padding;
  pa.style.boxSizing=prev.boxSizing;
 };
 window.addEventListener("afterprint",cleanup,{once:true});

 // Se muestra en su posición real antes de imprimir. No hay scale(), zoom,
 // reducción automática ni modificación del tamaño de la orden.
 pa.style.visibility="visible";
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 window.print();
}

async function resetDesignsForDesigner(d){
 if(!db||!state.isAdmin)return;
 const designer=String(d||"").trim().toUpperCase();
 if(!DESIGNERS.includes(designer))return;
 if(!confirm("¿REINICIAR LOS DISEÑOS DE "+designer+"?\n\nSe eliminarán los diseños activos y el acumulado histórico de rendimiento de este diseñador.\n\nSus órdenes (OP) NO se borrarán ni modificarán.\n\nEsta acción es permanente y deja el módulo de diseños en $0 y 0 diseños para este diseñador."))return;
 try{
  const targets=[];
  const logs=await db.collection("designLogs").where("designer","==",designer).get();
  logs.forEach(doc=>targets.push({collection:"designLogs",id:doc.id}));
  const stats=await db.collection("designStats").where("designer","==",designer).get();
  stats.forEach(doc=>targets.push({collection:"designStats",id:doc.id}));
  for(let i=0;i<targets.length;i+=450){
   const batch=db.batch();
   targets.slice(i,i+450).forEach(t=>batch.delete(db.collection(t.collection).doc(t.id)));
   await batch.commit();
  }
  state.confirmResetDesignFor=null;
  render();
  alert("Diseños de "+designer+" reiniciados correctamente. El rendimiento de diseños quedó en cero. Las órdenes OP permanecen intactas.");
 }catch(err){
  alert("No se pudieron reiniciar los diseños de "+designer+": "+err.message);
 }
}

function designPayment(value){
 const v=Math.max(0,n(value));
 // Regla especial: un diseño cobrado exactamente en $10.000 COP
 // se liquida íntegramente al diseñador y no genera participación para la empresa.
 if(v===10000)return {designer:v,company:0,rate:1};
 return {designer:v*0.50,company:v*0.50,rate:0.50};
}

async function consolidatePaidDesign(item,actor){
 const p=designPayment(item.value), paidAt=Date.now();
 // Guardar primero un comprobante detallado para poder verificar qué OP se pagó.
 const paymentRef=db.collection("designPayments").doc(item.id);
 await paymentRef.set({designId:item.id,designer:String(item.designer||"").trim().toUpperCase(),date:item.date||todayStr(),paidAt,paidBy:actor||"ADMINISTRADOR",opCode:item.opCode||"",client:item.client||"",description:item.description||"",value:n(item.value),paymentDesigner:n(p.designer),companyShare:n(p.company),paymentRate:p.rate});
 const id=designStatId(item.designer,item.date),ref=db.collection("designStats").doc(id);
 await db.runTransaction(async tx=>{
   const snap=await tx.get(ref),old=snap.exists?(snap.data()||{}):{};
   tx.set(ref,{designer:String(item.designer||"").trim().toUpperCase(),date:item.date||todayStr(),count:n(old.count)+1,value:n(old.value)+n(item.value),designerPay:n(old.designerPay)+n(p.designer),companyShare:n(old.companyShare)+n(p.company),paidCount:n(old.paidCount)+1,updatedAt:paidAt,lastPaidAt:paidAt,lastPaidBy:actor||"ADMINISTRADOR"},{merge:true});
 });
 // El detalle sale de pendientes, pero permanece en el histórico hasta el siguiente mes.
 await db.collection("designLogs").doc(item.id).delete();
}


async function purgeMonthlyDesignPayments(){
 if(!db)return;
 try{
  const now=new Date(),monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const old=await db.collection("designPayments").where("paidAt","<",monthStart).get();
  for(let i=0;i<old.docs.length;i+=400){
   const batch=db.batch();old.docs.slice(i,i+400).forEach(doc=>batch.delete(doc.ref));await batch.commit();
  }
 }catch(e){console.warn("No se pudo limpiar el historial mensual de pagos",e)}
}

function deleteDesign(id){
 if(!db)return;
 const item=(state.designLogs||[]).find(x=>x.id===id);
 if(!item)return;
 const canDelete=state.isAdmin||state.isViewer||(!state.isViewer&&item.designer===state.role);
 if(!canDelete){
  alert("Solo puedes eliminar tus propios diseños. El administrador puede eliminar cualquier diseño.");
  return;
 }
 if(!confirm("¿Eliminar este diseño?\n\nEsta acción es para pruebas/limpieza y NO crea estadísticas.\n\nOP: "+(item.opCode||"—")+"\nDiseñador: "+(item.designer||"—")+"\nValor: $ "+fmtNum(item.value,0)))return;
 db.collection("designLogs").doc(id).delete().catch(err=>alert("No se pudo eliminar: "+err.message));
}

 const inPeriod=x=>(!start||String(x.date||"")>=start)&&(!end||String(x.date||"")<=end);
 const filtered=liveRows.filter(inPeriod);
 const paidStats=statsRows.filter(inPeriod);

 // El informe combina: registros operativos todavía no pagados + históricos
 // consolidados de pagos ya eliminados. Así el detalle se limpia, pero las cifras no.
 const liveValue=filtered.reduce((a,x)=>a+n(x.value),0);
 const statValue=paidStats.reduce((a,x)=>a+n(x.value),0);
 const liveCount=filtered.length;
 const statCount=paidStats.reduce((a,x)=>a+n(x.count),0);
 const total=liveValue+statValue, count=liveCount+statCount;

 const livePayments=filtered.map(x=>designPayment(x.value));
 const statDesignerPay=paidStats.reduce((a,x)=>a+n(x.designerPay),0);
 const statCompanyShare=paidStats.reduce((a,x)=>a+n(x.companyShare),0);
 const totalDesignerPay=livePayments.reduce((a,x)=>a+x.designer,0)+statDesignerPay;
 const totalCompanyShare=livePayments.reduce((a,x)=>a+x.company,0)+statCompanyShare;
 const paidCount=paidStats.reduce((a,x)=>a+n(x.paidCount||x.count),0);
 const paidDesignerValue=statDesignerPay;
 const pendingDesignerValue=livePayments.reduce((a,x)=>a+x.designer,0);
 const pendingCount=filtered.length;
 const pendingValue=liveValue;

 const by=DESIGNERS.map((d,i)=>{
   const live=filtered.filter(x=>x.designer===d);
   const hist=paidStats.filter(x=>x.designer===d);
   const value=live.reduce((a,y)=>a+n(y.value),0)+hist.reduce((a,y)=>a+n(y.value),0);
   const qty=live.length+hist.reduce((a,y)=>a+n(y.count),0);
   return {d,live,hist,value,qty,color:["#21c8ff","#a66cff","#4ee39a","#ffbf4d"][i%4]};
 }).filter(x=>x.qty>0);

 const maxValue=Math.max(1,...by.map(x=>x.value));
 const maxQty=Math.max(1,...by.map(x=>x.qty));
 const topValue=by.slice().sort((a,b)=>b.value-a.value)[0];
 const topQty=by.slice().sort((a,b)=>b.qty-a.qty)[0];

 const days={};
 filtered.forEach(x=>{if(x.date)days[x.date]=(days[x.date]||0)+1});
 paidStats.forEach(x=>{if(x.date)days[x.date]=(days[x.date]||0)+n(x.count)});
 const trend=Object.keys(days).sort().map(d=>({d,value:days[d]}));
 const maxTrend=Math.max(1,...trend.map(x=>x.value));

 const shares=by.map(x=>({d:x.d,value:x.value,color:x.color}));
 let acc=0;
 const donutParts=shares.map(x=>{const p=total?x.value/total*100:0;const out={...x,start:acc,end:acc+p};acc+=p;return out});
 const periodText=start&&end?(start===end?start:`${start} → ${end}`):"Todo el historial disponible";

 // Ranking de cantidades y valores, explícito y separado.
 const qtyRank=by.slice().sort((a,b)=>b.qty-a.qty||b.value-a.value);
 const valueRank=by.slice().sort((a,b)=>b.value-a.value||b.qty-a.qty);

 return `<section class="design-dashboard">
  ${admin?`<div class="op-card">

    <div class="design-hero-top">
     <div>
      <div class="dash-kicker">ADMINISTRACIÓN · REGISTRO DE DISEÑO</div>
      <h2 style="margin:5px 0 0;color:#fff">Registrar diseño para cualquier diseñador</h2>
      <p style="margin:4px 0 0;color:#9db1cc;font-size:11px">El administrador puede crear diseños de prueba, registrar producción real y eliminarlos cuando lo necesite.</p>
     </div>
    </div>
    <div class="op-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:14px">
     <label class="op-field"><span>Diseñador *</span><select required name="designer">${optionsHtml(DESIGNERS,"")}</select></label>
     <label class="op-field"><span>Orden de producción (OP) *</span><input required name="opCode" maxlength="40" placeholder="Ej. OP-CARLOS-0001"></label>
     <label class="op-field">Fecha<input required type="date" name="date" value="${todayStr()}"></label>
     <label class="op-field">Cliente<input required name="client" maxlength="160"></label>
     <label class="op-field">Descripción de diseño<input required name="description" maxlength="500"></label>
     <label class="op-field">Valor total cobrado (COP)<input required type="number" min="0" step="1" name="value"></label>
     <label class="op-field"><span>Pago al diseñador</span><input id="design-pay-preview" type="text" value="$ 0" readonly style="color:#4ee39a!important;font-weight:900!important;border-color:#2d9f75!important;background:#071f1a!important"></label>
     <label class="op-field"><span>Participación empresa</span><input id="design-company-preview" type="text" value="$ 0" readonly style="color:#63cfff!important;font-weight:900!important;border-color:#2868a9!important;background:#071a36!important"></label>
    </div>
    <p class="op-note">Regla especial: si el valor cobrado es exactamente <b>$10.000</b>, el diseñador recibe el 100% y la empresa $0.</p>
    <button class="op-btn op-btn-primary" style="margin-top:12px">Registrar diseño</button>
   </form>
  </div>`:
  (!viewer?`<div class="op-card">
   <form id="design-form">
    <div class="design-hero-top"><div><div class="dash-kicker">REGISTRO DE DISEÑO</div><h2 style="margin:5px 0 0;color:#fff">Registrar diseño realizado</h2><p style="margin:4px 0 0;color:#9db1cc;font-size:11px">Cada diseño queda asociado a una Orden de Producción.</p></div></div>
    <div class="op-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:14px">
     <label class="op-field"><span>Orden de producción (OP) *</span><input required name="opCode" maxlength="40" placeholder="Ej. OP-CARLOS-0001"></label>
     <label class="op-field">Fecha<input required type="date" name="date" value="${todayStr()}"></label>
     <label class="op-field">Cliente<input required name="client" maxlength="160"></label>
     <label class="op-field">Descripción de diseño<input required name="description" maxlength="500"></label>
     <label class="op-field">Valor total cobrado (COP)<input required type="number" min="0" step="1" name="value"></label>
     <label class="op-field"><span>Pago al diseñador</span><input id="design-pay-preview" type="text" value="$ 0" readonly style="color:#4ee39a!important;font-weight:900!important;border-color:#2d9f75!important;background:#071f1a!important"></label>
     <label class="op-field"><span>Participación empresa</span><input id="design-company-preview" type="text" value="$ 0" readonly style="color:#63cfff!important;font-weight:900!important;border-color:#2868a9!important;background:#071a36!important"></label>
    </div>
    <p class="op-note">Regla especial: si el valor cobrado es exactamente <b>$10.000</b>, el diseñador recibe el 100% y la empresa $0.</p>
    <button class="op-btn op-btn-primary" style="margin-top:12px">Registrar diseño</button>
   </form>
  </div>`:"")}

  <div class="design-hero">
   <div class="design-hero-top">
    <div><div class="dash-kicker">CENTRO DE RENDIMIENTO · DISEÑO</div><h2>${admin?"Rendimiento de diseño":"Consulta de rendimiento de diseño"}</h2><p>El periodo combina diseños pendientes con cifras consolidadas de diseños ya pagados y eliminados.</p></div>
    <div style="padding:9px 12px;border:1px solid #3c7fbb;border-radius:10px;background:#09234a;color:#9edaff;font-size:10px;font-weight:800">PERIODO · ${esc(periodText)}</div>
   </div>
   ${(admin||viewer)?`<div class="op-row" style="margin-top:14px">
     <label class="op-field" style="min-width:150px">Diseñador<select id="design-filter"><option value="TODOS">Todos</option>${DESIGNERS.map(d=>`<option value="${d}" ${selectedDesigner===d?"selected":""}>${d}</option>`).join("")}</select></label>
     <label class="op-field" style="min-width:150px">Desde<input id="design-start" type="date" value="${start}"></label>
     <label class="op-field" style="min-width:150px">Hasta<input id="design-end" type="date" value="${end}"></label>
    </div>`:""}
   <div class="design-kpis">
    <div class="design-kpi"><span>DISEÑOS DEL PERIODO</span><strong>${fmtNum(count,0)}</strong><small>pendientes + liquidados</small></div>
    <div class="design-kpi"><span>VALOR TOTAL</span><strong>$ ${fmtNum(total,0)}</strong><small>COP · no se pierde al pagar</small></div>
    <div class="design-kpi"><span>YA PAGADO A DISEÑADORES</span><strong>$ ${fmtNum(paidDesignerValue,0)}</strong><small>${fmtNum(paidCount,0)} diseños liquidados</small></div>
    <div class="design-kpi"><span>FALTA POR PAGAR</span><strong>$ ${fmtNum(pendingDesignerValue,0)}</strong><small>${fmtNum(pendingCount,0)} diseños pendientes</small></div>
    <div class="design-kpi"><span>PARTICIPACIÓN EMPRESA</span><strong>$ ${fmtNum(totalCompanyShare,0)}</strong><small>incluye históricos consolidados</small></div>
    <div class="design-kpi"><span>LÍDER EN CANTIDAD</span><strong>${topQty?esc(topQty.d):"—"}</strong><small>${topQty?fmtNum(topQty.qty,0)+" diseños":"sin datos"}</small></div>
   </div>
  </div>

  <div class="design-panel" style="margin-top:16px">
   <h3>💳 Estado de pagos a diseñadores</h3>
   <div class="design-panel-sub">Comparación directa entre lo que ya se pagó y lo que todavía está pendiente.</div>
   <div class="design-grid" style="margin-top:10px">
    <div class="design-panel" style="margin:0"><div class="design-panel-sub">PAGADO</div><div style="font-size:28px;font-weight:900;color:#4ee39a">$ ${fmtNum(paidDesignerValue,0)}</div><div class="design-bar-track"><div class="design-bar-fill" style="width:${Math.min(100,totalDesignerPay?paidDesignerValue/Math.max(totalDesignerPay,1)*100:0)}%;background:linear-gradient(90deg,#20c997,#4ee39a)"></div></div></div>
    <div class="design-panel" style="margin:0"><div class="design-panel-sub">FALTA POR PAGAR</div><div style="font-size:28px;font-weight:900;color:#ffbf4d">$ ${fmtNum(pendingDesignerValue,0)}</div><div class="design-bar-track"><div class="design-bar-fill" style="width:${Math.min(100,totalDesignerPay?pendingDesignerValue/Math.max(totalDesignerPay,1)*100:0)}%;background:linear-gradient(90deg,#ff8f3d,#ffbf4d)"></div></div></div>
   </div>
  </div>

  <div class="design-grid">
   <div class="design-panel">
    <h3>🏆 Líderes del periodo · cantidades</h3>
    <div class="design-panel-sub">Ranking de diseños realizados, incluyendo los que ya fueron pagados y eliminados del detalle.</div>
    <div class="design-bars">${qtyRank.map((x,i)=>`<div class="design-bar-row"><div class="design-bar-name"><b style="color:#71d8ff">${i+1}.</b> ${esc(x.d)}</div><div class="design-bar-track"><div class="design-bar-fill" style="width:${Math.max(3,x.qty/maxQty*100)}%;background:linear-gradient(90deg,${x.color},#21c8ff)"></div></div><div class="design-bar-value">${fmtNum(x.qty,0)} diseños</div></div>`).join("")||'<div class="design-empty">Sin registros para este periodo.</div>'}</div>
   </div>
   <div class="design-panel">
    <h3>💰 Líderes del periodo · valores</h3>
    <div class="design-panel-sub">Ranking por valor total cobrado, no por saldo pendiente.</div>
    <div class="design-bars">${valueRank.map((x,i)=>`<div class="design-bar-row"><div class="design-bar-name"><b style="color:#71d8ff">${i+1}.</b> ${esc(x.d)}</div><div class="design-bar-track"><div class="design-bar-fill" style="width:${Math.max(3,x.value/maxValue*100)}%;background:linear-gradient(90deg,${x.color},#21c8ff)"></div></div><div class="design-bar-value">$ ${fmtNum(x.value,0)}</div></div>`).join("")||'<div class="design-empty">Sin registros para este periodo.</div>'}</div>
   </div>
  </div>

  <div class="design-grid">
   <div class="design-panel"><h3>Valor cobrado por diseñador</h3><div class="design-panel-sub">Total histórico del periodo seleccionado.</div><div class="design-bars">${by.map(x=>`<div class="design-bar-row"><div class="design-bar-name">${esc(x.d)}</div><div class="design-bar-track"><div class="design-bar-fill" style="width:${Math.max(3,x.value/maxValue*100)}%;background:linear-gradient(90deg,${x.color},#21c8ff)"></div></div><div class="design-bar-value">$ ${fmtNum(x.value,0)}</div></div>`).join("")||'<div class="design-empty">Sin registros para este periodo.</div>'}</div></div>
   <div class="design-panel"><h3>Participación del valor</h3><div class="design-panel-sub">Distribución porcentual del valor cobrado.</div><div class="design-donut-wrap">${shares.length?`<div class="design-donut" style="background:conic-gradient(${donutParts.map(x=>`${x.color} ${x.start}% ${x.end}%`).join(",")})"><div class="design-donut-center"><b>${total?"100":"0"}%</b><span>distribución</span></div></div>`:'<div class="design-empty">Sin datos.</div>'}</div><div class="design-legend">${shares.map(x=>`<div class="design-legend-row"><i style="background:${x.color}"></i><span>${esc(x.d)}</span><b>${total?Math.round(x.value/total*100):0}%</b></div>`).join("")}</div></div>
  </div>

  <div class="design-panel"><h3>Ritmo de diseños</h3><div class="design-panel-sub">Cantidad de diseños registrados por día, incluyendo históricos consolidados.</div>${trend.length?`<div class="design-trend">${trend.map(x=>`<div class="design-trend-col"><div class="design-trend-value">${x.value}</div><div class="design-trend-bar" style="height:${Math.max(8,x.value/maxTrend*135)}px"></div><div class="design-trend-label">${new Date(x.d+"T00:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short"})}</div></div>`).join("")}</div>`:'<div class="design-empty">Sin actividad en el periodo.</div>'}</div>

  <div class="design-panel">
   <h3>Detalle de diseños activos</h3>
   <div class="design-panel-sub">Los diseños pendientes permanecen aquí. Al marcar <b>PAGADO</b>, se guarda un detalle en el histórico mensual del diseñador y se consolida el rendimiento.</div>
   <div style="overflow:auto">
    <table class="op-table">
     <thead><tr><th>Fecha</th><th>OP</th><th>Diseñador</th><th>Cliente</th><th>Descripción</th><th>Valor cobrado</th><th>Pago diseñador</th><th>Acciones</th></tr></thead>
     <tbody>
      ${filtered.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(x=>{
       const p=designPayment(x.value);
       return `<tr>
        <td>${esc(x.date)}</td><td><b>${esc(x.opCode||"—")}</b></td><td>${esc(x.designer)}</td><td>${esc(x.client)}</td><td>${esc(x.description)}</td>
        <td>$ ${fmtNum(x.value,0)}</td><td style="color:#4ee39a;font-weight:900">$ ${fmtNum(p.designer,0)}</td>
        <td style="white-space:nowrap">${(admin||viewer)?`<button class="op-btn op-btn-sm design-pay-btn" data-design-paid="${esc(x.id)}">PAGADO · CONSOLIDAR</button>`:""} ${(admin||viewer||x.designer===state.role)?`<button class="op-btn op-btn-sm op-btn-danger" data-design-delete="${esc(x.id)}">ELIMINAR</button>`:"—"}</td>
       </tr>`;
      }).join("")||`<tr><td colspan="8">No hay diseños activos pendientes en este periodo.</td></tr>`}
     </tbody>
    </table>
   </div>
  </div>
  <div class="design-panel">
   <div class="op-row" style="justify-content:space-between;align-items:center"><div><h3>Histórico mensual de pagos</h3><div class="design-panel-sub">El detalle de pagos se guarda por fuera de las tablas de pendientes. Exporta una copia para verificar diseñador, OP, cliente y fecha.</div></div><div class="op-row"><button type="button" class="op-btn op-btn-primary op-btn-sm" id="export-design-payments">Exportar Excel (CSV)</button><button type="button" class="op-btn op-btn-ghost op-btn-sm" id="print-design-payments">Guardar PDF</button></div></div>
   <div style="font-size:12px;color:#9db7d3;margin-top:8px">Pagos registrados este mes: <b style="color:#fff">${(state.designPayments||[]).length}</b>. El historial detallado se elimina al cambiar de mes y abrir el sistema.</div>
  </div>
 </section>`;
}

function render(){
 const active=document.activeElement;
 const activeField=active&&active.closest?active.closest("[data-field]"):null;
 const focusKey=activeField?activeField.dataset.field:"";
 const activeId=active&&active.id?active.id:"";
 const selectionStart=active&&typeof active.selectionStart==="number"?active.selectionStart:null;
 const selectionEnd=active&&typeof active.selectionEnd==="number"?active.selectionEnd:null;
 let body="";
 // Mostrar selección de perfil y formularios de PIN sin esperar la conexión a Firestore.
 if(state.showAdminPin)body=pinBox();
 else if(state.showViewerPin)body=viewerPinBox();
 else if(state.showDesignerPin)body=designerPinBox();
 else if(!state.role&&!state.isAdmin&&!state.isViewer&&!state.isReadOnlyConsultation)body=`<div class="op-card" style="margin-top:20px;text-align:center;padding:35px"><b style="color:#ffffff">Elige tu perfil para continuar</b><p class="op-note">Selecciona tu nombre de diseñador. Para Administrador se solicitará el PIN.</p></div>`;
 else if(firestoreError){
  body=`<div class="op-modal-bg"><b style="color:#f6602c">No se pudo conectar a la base de datos</b><p style="font-size:13px;line-height:1.6">Detalle técnico: ${esc(firestoreError)}</p><p class="op-note">Verifica que Firestore esté habilitado y que sus reglas permitan lectura y escritura.</p></div>`;
 }
 else if(!state.ordersReady||!state.countersReady){
  body=`<div class="op-card" style="margin-top:20px"><p style="color:#8b96a3">Conectando con la base de datos... Puedes mantener esta pantalla abierta mientras termina la sincronización.</p></div>`;
 }
 else if(state.isViewer&&state.tab==="designs")body=tabsBar()+designsTab();
 else if(state.isViewer||state.isReadOnlyConsultation)body=tabsBar()+ordersTab();
 else if(state.tab==="dashboard"&&state.isAdmin)body=tabsBar()+dashboardTab();
 else if(state.tab==="admin"&&state.isAdmin)body=tabsBar()+adminCountersTab();
  else if(state.tab==="designers"&&state.isAdmin)body=tabsBar()+designersAdminTab();
 else if(state.tab==="designs"&&(state.isAdmin||(!state.isViewer&&!state.isReadOnlyConsultation&&state.role)))body=tabsBar()+designsTab();
 else if(state.tab==="orders")body=tabsBar()+ordersTab();
 else body=tabsBar()+newOrderTab();

 root.innerHTML=header()+body;
 bind();
 if(focusKey||activeId){
  const next=focusKey
   ? root.querySelector(`[data-field="${CSS.escape(focusKey)}"]`)
   : (activeId?root.querySelector(`#${CSS.escape(activeId)}`):null);
  if(next){
   next.focus({preventScroll:true});
   if(selectionStart!=null&&typeof next.setSelectionRange==="function"){
    try{next.setSelectionRange(selectionStart,selectionEnd==null?selectionStart:selectionEnd)}catch(e){}
   }
  }
 }
}

function autoGrowTextarea(el){
 if(!el)return;
 el.style.height="auto";
 el.style.height=Math.max(el.scrollHeight,54)+"px";
}
function bind(){
 root.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>setState({tab:el.dataset.tab}));
 const roleSel=root.querySelector("#role-select");
 if(roleSel)roleSel.onchange=e=>{
  const v=e.target.value;
  if(v==="__ADMIN__"){state.showAdminPin=true;state.showViewerPin=false;state.showDesignerPin=false;state.adminPinError="";render();return}
  if(v==="__VIEWER__"){state.pendingReadOnly=false;state.showViewerPin=true;state.showAdminPin=false;state.showDesignerPin=false;state.viewerPinError="";render();return}
   if(v==="__READONLY__"){state.pendingReadOnly=true;state.showViewerPin=true;state.showAdminPin=false;state.showDesignerPin=false;state.viewerPinError="";render();return}
  if(DESIGNER_PINS[v]){state.pendingDesigner=v;state.showDesignerPin=true;state.showAdminPin=false;state.showViewerPin=false;state.designerPinError="";render()}
 };

 const logout=root.querySelector("#logout-btn");
 if(logout)logout.onclick=()=>{state.role=null;state.isAdmin=false;state.isViewer=false;state.isReadOnlyConsultation=false;state.showAdminPin=false;state.showViewerPin=false;state.showDesignerPin=false;saveSession();setState({tab:"new"})};

 const ap=root.querySelector("#admin-pin-input");
 const as=root.querySelector("#admin-pin-submit");
 const ac=root.querySelector("#admin-pin-cancel");
 const tryAdmin=()=>{
  if(ap&&ap.value.trim()===ADMIN_PIN){state.role="Administrador";state.isAdmin=true;state.showAdminPin=false;state.adminPinError="";setState({tab:"dashboard"});return}
  state.adminPinError="PIN incorrecto. Intenta de nuevo.";render();
 };
 if(as)as.onclick=tryAdmin;
 if(ap){ap.focus();ap.onkeydown=e=>{if(e.key==="Enter")tryAdmin()}}
 if(ac)ac.onclick=()=>setState({showAdminPin:false,adminPinError:""});

 const vp=root.querySelector("#viewer-pin-input");
 const vs=root.querySelector("#viewer-pin-submit");
 const vc=root.querySelector("#viewer-pin-cancel");
 const tryViewer=()=>{
  const entered=vp?vp.value.trim():"";
  if(state.pendingReadOnly && entered===READONLY_VIEWER_PIN){
   state.role="CONSULT-ART SOLO LECTURA";state.isAdmin=false;state.isViewer=false;state.isReadOnlyConsultation=true;state.pendingReadOnly=false;state.showViewerPin=false;state.viewerPinError="";saveSession();setState({tab:"orders"});return;
  }
  if(!state.pendingReadOnly && entered===VIEWER_PIN){
   state.role="CONSULT-ART";state.isAdmin=false;state.isViewer=true;state.isReadOnlyConsultation=false;state.showViewerPin=false;state.viewerPinError="";saveSession();setState({tab:"orders"});return;
  }
  state.viewerPinError="PIN incorrecto. Intenta de nuevo.";render();
 };
 if(vs)vs.onclick=tryViewer;
 if(vp){vp.focus();vp.onkeydown=e=>{if(e.key==="Enter")tryViewer()}}
 if(vc)vc.onclick=()=>setState({showViewerPin:false,pendingReadOnly:false,viewerPinError:""});

 const dp=root.querySelector("#designer-pin-input");
 const ds=root.querySelector("#designer-pin-submit");
 const dc=root.querySelector("#designer-pin-cancel");
 const tryDesigner=()=>{
  if(dp&&dp.value.trim()===DESIGNER_PINS[state.pendingDesigner]){
   state.role=state.pendingDesigner;state.isAdmin=false;state.showDesignerPin=false;state.designerPinError="";saveSession();setState({tab:"new"});return
  }
  state.designerPinError="PIN incorrecto. Intenta de nuevo.";render();
 };
 if(ds)ds.onclick=tryDesigner;
 if(dp){dp.focus();dp.onkeydown=e=>{if(e.key==="Enter")tryDesigner()}}
 if(dc)dc.onclick=()=>setState({showDesignerPin:false,pendingDesigner:null,designerPinError:""});

 const imageInput=root.querySelector("#order-image");
 const imagePasteZone=root.querySelector("#image-paste-zone");
 const addImages=async(files,sourceInput)=>{
  const list=Array.from(files||[]).filter(f=>f&&f.type&&f.type.startsWith("image/"));
  if(!list.length){if(files&&files.length)alert("El contenido pegado no contiene una imagen.");return}
  const current=imageArray(state.form.imageData),available=5-current.length;
  if(available<=0){alert("Puedes guardar hasta 5 imágenes por OP.");if(sourceInput)sourceInput.value="";return}
  const selected=list.slice(0,available);
  if(list.length>available)alert("Solo se agregarán las primeras "+available+" imágenes para completar el máximo de 5.");
  try{
   const results=[];
   for(const file of selected)results.push(await readAndCompressImage(file));
   state.form.imageData=current.concat(results.map(r=>r.data));
   const existingNames=Array.isArray(state.form.imageNames)?state.form.imageNames:[];
   state.form.imageNames=existingNames.concat(results.map((r,i)=>r.name||("Imagen "+(existingNames.length+i+1))));
   state.form.imageName=state.form.imageNames[0]||"";
   render();
  }catch(err){alert(err.message);if(sourceInput)sourceInput.value=""}
 };

  // El recorrido con TAB queda limitado exclusivamente a los campos de la OP.
  // No usamos tabindex positivos porque pueden provocar saltos cuando el formulario se vuelve a renderizar.
  tabOrder.forEach((key)=>{
   const el=form.querySelector(`[data-field="${CSS.escape(key)}"]`);
   if(el)el.tabIndex=0;
  });
  const opFields=tabOrder.map(key=>form.querySelector(`[data-field="${CSS.escape(key)}"]`)).filter(Boolean);
  opFields.forEach((el,index)=>{
   el.onkeydown=(e)=>{
    if(e.key!="Tab")return;
    e.preventDefault();
    const nextIndex=e.shiftKey ? index-1 : index+1;
    const targetIndex=nextIndex<0 ? opFields.length-1 : nextIndex>=opFields.length ? 0 : nextIndex;
    const target=opFields[targetIndex];
    if(target){
     target.focus({preventScroll:true});
     if(typeof target.select==="function" && target.tagName!=="SELECT" && target.type!=="date" && target.type!=="time")target.select();
    }
   };
  });
  const pasteZone=form.querySelector("#image-paste-zone");
  if(pasteZone)pasteZone.tabIndex=-1;
  const fileInput=form.querySelector("#order-image");
  if(fileInput)fileInput.tabIndex=-1;
  form.querySelectorAll("[data-field]").forEach(el=>{
   const key=el.dataset.field;
   el.oninput=()=>{
    state.form[key]=el.value;
    if(key==="notes")autoGrowTextarea(el);
   };
   el.onchange=()=>{
    state.form[key]=el.value;
    if(key==="height")syncMaterialLength();
    if(["height","finish","width","quantity","paymentMethod"].includes(key)){
     const focusKey=document.activeElement?.dataset?.field||key;
     render();
     if(focusKey){
      requestAnimationFrame(()=>{
       const next=document.querySelector(`#order-form [data-field="${CSS.escape(focusKey)}"]`);
       if(next){
        next.focus({preventScroll:true});
        if(typeof next.select==="function" && next.tagName!=="SELECT" && next.type!=="date" && next.type!=="time")next.select();
       }
      });
     }
    }
   };
  });
